apiVersion: v1
kind: Namespace
metadata:
  name: apartmani-prgic-be
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apartmani-prgic-be-data
  namespace: apartmani-prgic-be
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apartmani-prgic-be
  namespace: apartmani-prgic-be
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apartmani-prgic-be
  template:
    metadata:
      labels:
        app: apartmani-prgic-be
    spec:
      containers:
        - name: apartmani-prgic-be
          image: apartmani-prgic-be:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: /data/sqlite.db
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: apartmani-prgic-be-data
---
apiVersion: v1
kind: Service
metadata:
  name: apartmani-prgic-be
  namespace: apartmani-prgic-be
spec:
  selector:
    app: apartmani-prgic-be
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apartmani-prgic-be-ingress
  namespace: apartmani-prgic-be
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: api.apartmani-prgic.hr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apartmani-prgic-be
                port:
                  number: 3000
  tls:
    - hosts:
        - api.apartmani-prgic.hr
      secretName: apartmani-prgic-be-tls
