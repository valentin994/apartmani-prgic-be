name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /root/apartmani-prgic-be
            git fetch origin master
            git reset --hard origin/master
            SHA=$(git rev-parse --short HEAD)
            docker build -t apartmani-prgic-be:$SHA .
            docker save apartmani-prgic-be:$SHA | sudo k3s ctr images import -
            kubectl set image deployment/apartmani-prgic-be apartmani-prgic-be=apartmani-prgic-be:$SHA -n apartmani-prgic-be
            kubectl rollout status deployment/apartmani-prgic-be -n apartmani-prgic-be --timeout=120s
