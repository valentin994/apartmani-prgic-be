[package]
name = "prgic-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"]}
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["sqlite", "runtime-tokio", "migrate"]}
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"]}
tower-http = { version = "0.7.1", features = ["cors"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
